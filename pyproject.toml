[project]
name = "insight-daily-dashboard"
version = "0.1.0"
description = "知势日报的数据采集、校验与生成层"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1,<1",
  "pydantic>=2.12.5,<3",
  "pyyaml>=6.0.3,<7",
  "tenacity>=9.1.4,<10",
]

[project.optional-dependencies]
market = [
  "akshare>=1.17.93",
  "baostock>=0.8.9",
  "pandas>=3.0.1,<4",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2,<10",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.15.6,<1",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/insight_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["python", "scripts", "tests/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
