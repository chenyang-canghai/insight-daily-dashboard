<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#14523f" />
    <title>暂时离线｜知势</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: #18332a;
        background: #f2f4f0;
      }
      main {
        width: min(86vw, 420px);
        padding: 32px;
        border: 1px solid #dce3de;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 50px rgba(17, 55, 43, 0.08);
      }
      span {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        color: #fff;
        background: #14523f;
        font:
          700 24px Georgia,
          serif;
      }
      h1 {
        margin: 22px 0 10px;
        font:
          600 28px Georgia,
          "Songti SC",
          serif;
      }
      p {
        margin: 0 0 20px;
        color: #66736e;
        line-height: 1.7;
      }
      a {
        min-height: 44px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        border-radius: 10px;
        color: #fff;
        background: #14523f;
        text-decoration: none;
        font-weight: 650;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e8efeb;
          background: #0c1210;
        }
        main {
          border-color: #26372f;
          background: #121c18;
        }
        p {
          color: #a3b0aa;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span aria-hidden="true">知</span>
      <h1>网络暂时不可用</h1>
      <p>
        已经访问过的页面仍可离线阅读。恢复网络后，点击下方按钮获取最新日报。
      </p>
      <a href="./">重新连接</a>
    </main>
  </body>
</html>
