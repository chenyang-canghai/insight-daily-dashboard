name: Update A-Share Market

on:
  schedule:
    - cron: "25 10 * * 1-5" # UTC; Beijing 18:25
  workflow_dispatch:
    inputs:
      date:
        {
          description: "Beijing date (YYYY-MM-DD)",
          required: false,
          type: string,
        }
      mode:
        {
          description: "Generation mode",
          required: true,
          default: live,
          type: choice,
          options: [live, demo],
        }
      dry_run:
        {
          description: "Validate without committing",
          required: false,
          default: false,
          type: boolean,
        }

permissions:
  contents: write
  actions: write

concurrency:
  group: update-market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      MARKET_PROVIDER: ${{ vars.MARKET_PROVIDER || 'akshare' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.12.7", enable-cache: true }
      - run: uv sync --frozen --extra market --dev
      - name: Verify trading day, fetch and validate
        shell: bash
        run: |
          target_date="${{ inputs.date }}"
          [ -n "$target_date" ] || target_date="$(date +%F)"
          mode="${{ inputs.mode }}"
          args=(--date "$target_date" --module market)
          [ "$mode" = "demo" ] && args+=(--demo)
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          uv run python scripts/generate_daily_digest.py "${args[@]}"
          uv run python scripts/build_public_data.py
      - name: Commit changed content
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          if git diff --quiet -- data public/data; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          git commit -m "data(market): update A-share close review"
          git push
          gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
