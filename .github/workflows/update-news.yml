name: Update News Daily

on:
  schedule:
    - cron: "15 23 * * *" # UTC; Beijing 07:15 next day
  workflow_dispatch:
    inputs:
      date:
        {
          description: "Beijing date (YYYY-MM-DD)",
          required: false,
          type: string,
        }
      mode:
        {
          description: "Generation mode",
          required: true,
          default: live,
          type: choice,
          options: [live, demo],
        }
      dry_run:
        {
          description: "Validate without committing",
          required: false,
          default: false,
          type: boolean,
        }

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT || '60' }}
      LLM_MAX_RETRIES: ${{ vars.LLM_MAX_RETRIES || '3' }}
      LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || '0.2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.12.7", enable-cache: true }
      - run: uv sync --frozen --dev
      - name: Collect, analyze and validate
        shell: bash
        run: |
          target_date="${{ inputs.date }}"
          [ -n "$target_date" ] || target_date="$(date +%F)"
          mode="${{ inputs.mode }}"
          args=(--date "$target_date" --module news)
          [ "$mode" = "demo" ] && args+=(--demo)
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          uv run python scripts/generate_daily_digest.py "${args[@]}"
          uv run python scripts/build_public_data.py
      - name: Commit changed content
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          if git diff --quiet -- data public/data; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          git commit -m "data(news): update Beijing daily content"
          git push
